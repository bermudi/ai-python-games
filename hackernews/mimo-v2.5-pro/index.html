<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HN Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070a10;--surface:#0c1018;--surface-2:#111722;--surface-hover:#161d2a;
  --border:#1a2235;--border-light:#243048;
  --accent:#4ecdc4;--accent-glow:rgba(78,205,196,.12);--accent-warm:#e8a830;
  --text:#9aa3b8;--text-bright:#d8dde8;--text-dim:#4e576a;
  --red:#e05252;--green:#4ecdc4;
  --font-d:'Syne',system-ui,sans-serif;--font-m:'DM Mono','Courier New',monospace;
  --r:6px;--rl:10px;--tr:.2s ease;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:var(--font-m);font-weight:400;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ---- HEADER ---- */
.hdr{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(12,16,24,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:500;display:flex;align-items:center;gap:16px;padding:0 20px}
.logo{font-family:var(--font-d);font-weight:800;font-size:1.3rem;color:var(--text-bright);letter-spacing:-.5px;white-space:nowrap;user-select:none}
.logo sup{font-size:.55em;color:var(--accent);font-weight:600;vertical-align:super;margin-left:1px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:6px 12px;border-radius:var(--r);font-size:.8rem;font-weight:500;color:var(--text-dim);transition:all var(--tr);white-space:nowrap}
.nav-btn:hover{color:var(--text);background:var(--surface-2)}
.nav-btn.active{color:var(--accent);background:var(--accent-glow)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.search-wrap{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:0 10px;height:34px;transition:border-color var(--tr)}
.search-wrap:focus-within{border-color:var(--accent)}
.search-wrap svg{flex-shrink:0;color:var(--text-dim)}
.search-input{width:140px;border:none;background:transparent;color:var(--text-bright);font-family:var(--font-m);font-size:.8rem;outline:none}
.search-input::placeholder{color:var(--text-dim)}
.hdr-btn{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--text-dim);transition:all var(--tr)}
.hdr-btn:hover{color:var(--text-bright);background:var(--surface-2)}
.hdr-btn.on{color:var(--accent)}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent-warm);color:var(--bg);font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---- MAIN ---- */
.main{margin-top:56px;max-width:780px;margin-left:auto;margin-right:auto;padding:8px 16px 40px}
.story-list{display:flex;flex-direction:column}

/* ---- STORY CARD ---- */
.card{display:grid;grid-template-columns:36px 52px 1fr;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--border);transition:background var(--tr);position:relative;animation:fadeUp .4s ease both}
.card:hover{background:var(--surface-hover)}
.card.visited .card-title{color:var(--text-dim)}
.card.visited .card-title:hover{color:var(--accent)}
.card.focused{background:var(--surface-hover);outline:2px solid var(--accent);outline-offset:-2px}
.rank{font-family:var(--font-d);font-weight:800;font-size:1.15rem;color:var(--border-light);text-align:right;padding-top:3px;user-select:none;line-height:1}
.thumb{width:52px;height:52px;border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
.thumb img{width:28px;height:28px;object-fit:contain}
.thumb-text{color:var(--text-dim)}
.card-body{min-width:0}
.card-title{font-family:var(--font-d);font-weight:600;font-size:.95rem;color:var(--text-bright);line-height:1.4;display:block;margin-bottom:3px;word-break:break-word}
.card-title a{color:inherit;text-decoration:none}
.card-title a:hover{color:var(--accent);text-decoration:none}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.75rem;color:var(--text-dim);line-height:1.8}
.card-meta .domain{color:var(--accent);opacity:.7}
.card-meta svg{vertical-align:-2px;opacity:.6}
.card-meta .sep{opacity:.3}
.card-actions{display:flex;gap:2px;margin-top:5px;opacity:0;transition:opacity var(--tr)}
.card:hover .card-actions{opacity:1}
.card-actions button{padding:3px 8px;border-radius:var(--r);font-size:.7rem;color:var(--text-dim);display:flex;align-items:center;gap:4px;transition:all var(--tr)}
.card-actions button:hover{color:var(--accent);background:var(--accent-glow)}
.card-actions button.followed{color:var(--accent-warm)}

/* ---- SKELETON ---- */
.skel-list{display:flex;flex-direction:column}
.skel{display:grid;grid-template-columns:36px 52px 1fr;gap:12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--border);animation:fadeUp .4s ease both}
.skel-rank{width:24px;height:20px;border-radius:4px;background:var(--surface-2);animation:shimmer 1.5s infinite}
.skel-thumb{width:52px;height:52px;border-radius:var(--r);background:var(--surface-2);animation:shimmer 1.5s infinite}
.skel-body{display:flex;flex-direction:column;gap:8px}
.skel-line{height:12px;border-radius:4px;background:var(--surface-2);animation:shimmer 1.5s infinite}
.skel-line.w80{width:80%}.skel-line.w50{width:50%}.skel-line.w30{width:30%}
@keyframes shimmer{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ---- LOAD MORE ---- */
.load-more{display:block;margin:24px auto;padding:10px 28px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--font-d);font-weight:600;font-size:.85rem;transition:all var(--tr);letter-spacing:.5px}
.load-more:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

/* ---- OVERLAY & PANEL ---- */
.overlay{position:fixed;inset:0;background:rgba(4,6,10,.7);z-index:600;opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--surface);z-index:700;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.panel.on{transform:translateX(0)}
.panel-head{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:45vh}
.panel-head .ph-close{position:absolute;top:16px;right:16px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--text-dim);transition:all var(--tr);z-index:1}
.panel-head .ph-close:hover{color:var(--text-bright);background:var(--surface-2)}
.panel-head{position:relative}
.ph-title{font-family:var(--font-d);font-weight:700;font-size:1.1rem;color:var(--text-bright);line-height:1.4;margin-bottom:6px;padding-right:36px}
.ph-title a{color:inherit}
.ph-title a:hover{color:var(--accent)}
.ph-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--text-dim);align-items:center}
.ph-meta svg{vertical-align:-2px;opacity:.6}
.ph-meta .sep{opacity:.3}
.ph-selftext{margin-top:14px;padding:14px;background:var(--surface-2);border-radius:var(--r);font-size:.85rem;line-height:1.7;color:var(--text)}
.ph-selftext a{color:var(--accent)}
.ph-selftext p{margin-bottom:8px}
.ph-selftext code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:.8rem}
.ph-selftext pre{background:var(--bg);padding:10px;border-radius:var(--r);overflow-x:auto;margin:8px 0}
.ph-selftext pre code{background:none;padding:0}
.ph-actions{display:flex;gap:6px;margin-top:10px}
.ph-actions button{padding:5px 12px;border-radius:var(--r);border:1px solid var(--border);font-size:.75rem;color:var(--text-dim);display:flex;align-items:center;gap:5px;transition:all var(--tr)}
.ph-actions button:hover{border-color:var(--accent);color:var(--accent)}
.ph-actions button.followed{border-color:var(--accent-warm);color:var(--accent-warm)}

/* ---- COMMENTS ---- */
.panel-body{flex:1;overflow-y:auto;padding:16px 20px}
.cmt-count{font-family:var(--font-d);font-weight:700;font-size:.9rem;color:var(--text-dim);margin-bottom:16px;letter-spacing:.5px}
.cmt{border-left:3px solid var(--border);padding:10px 0 10px 14px;margin-top:2px;position:relative}
.cmt-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.cmt-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text-dim);transition:all var(--tr);flex-shrink:0}
.cmt-toggle:hover{color:var(--accent);background:var(--accent-glow)}
.cmt-toggle.collapsed svg{transform:rotate(-90deg)}
.cmt-toggle svg{transition:transform .2s ease}
.cmt-author{font-weight:500;font-size:.8rem;color:var(--text-bright)}
.cmt-author.op{color:var(--accent-warm)}
.cmt-time{font-size:.7rem;color:var(--text-dim)}
.cmt-replies{font-size:.7rem;color:var(--text-dim);cursor:pointer}
.cmt-replies:hover{color:var(--accent)}
.cmt-body{font-size:.85rem;line-height:1.7;color:var(--text);margin-top:4px;overflow-wrap:break-word}
.cmt-body p{margin-bottom:8px}
.cmt-body p:last-child{margin-bottom:0}
.cmt-body a{color:var(--accent);word-break:break-all}
.cmt-body code{background:var(--surface-2);padding:1px 5px;border-radius:3px;font-size:.8rem}
.cmt-body pre{background:var(--surface-2);padding:10px;border-radius:var(--r);overflow-x:auto;margin:8px 0}
.cmt-body pre code{background:none;padding:0}
.cmt-body i,.cmt-body em{color:var(--text-dim)}
.cmt-children{margin-left:0}
.cmt-dead{opacity:.4;font-style:italic}
.cmt-deleted{color:var(--text-dim);font-style:italic;font-size:.8rem}

/* depth colors */
.d0{border-left-color:var(--accent)}.d1{border-left-color:#45a5d1}.d2{border-left-color:#7cc867}
.d3{border-left-color:#d4b84c}.d4{border-left-color:#d18545}.d5{border-left-color:#c85555}
.d6{border-left-color:#9565b8}

/* ---- FOLLOWED DROPDOWN ---- */
.fol-drop{position:fixed;top:52px;right:16px;width:min(420px,90vw);max-height:65vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:550;display:none}
.fol-drop.on{display:block;animation:fadeUp .2s ease}
.fol-empty{padding:24px;text-align:center;color:var(--text-dim);font-size:.85rem}
.fol-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--tr)}
.fol-item:hover{background:var(--surface-hover)}
.fol-item:last-child{border-bottom:none}
.fol-item-body{flex:1;min-width:0}
.fol-item-title{font-family:var(--font-d);font-weight:600;font-size:.85rem;color:var(--text-bright);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fol-item-meta{font-size:.7rem;color:var(--text-dim);margin-top:3px;display:flex;gap:8px;align-items:center}
.fol-new{color:var(--accent-warm);font-weight:600}
.fol-rm{padding:4px;border-radius:4px;color:var(--text-dim);opacity:0;transition:all var(--tr);flex-shrink:0;align-self:center}
.fol-item:hover .fol-rm{opacity:1}
.fol-rm:hover{color:var(--red);background:rgba(224,82,82,.1)}

/* ---- EMPTY & ERROR ---- */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state h3{font-family:var(--font-d);font-weight:700;font-size:1.1rem;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:.85rem;margin-bottom:16px}
.retry-btn{padding:8px 20px;border-radius:var(--r);border:1px solid var(--border);color:var(--text);font-weight:500;transition:all var(--tr)}
.retry-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---- COMMENT SKELETON ---- */
.cmt-skel{padding:14px 0 14px 17px;border-left:3px solid var(--border);margin-top:4px}
.cmt-skel-head{display:flex;gap:8px;margin-bottom:8px}
.cmt-skel-bar{height:10px;border-radius:4px;background:var(--surface-2);animation:shimmer 1.5s infinite}
.cmt-skel-bar.w20{width:20%}.cmt-skel-bar.w60{width:60%}.cmt-skel-bar.w80{width:80%}.cmt-skel-bar.w40{width:40%}

/* ---- KEYBOARD HINT ---- */
.kb-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rl);padding:8px 16px;font-size:.7rem;color:var(--text-dim);z-index:100;white-space:nowrap;display:flex;gap:12px;opacity:.7;transition:opacity .3s}
.kb-hint:hover{opacity:1}
.kb-hint kbd{display:inline-block;padding:1px 5px;background:var(--bg);border:1px solid var(--border);border-radius:3px;font-family:var(--font-m);font-size:.65rem;color:var(--text);margin:0 2px}

/* ---- RESPONSIVE ---- */
@media(max-width:640px){
  .hdr{padding:0 12px;gap:8px}
  .logo{font-size:1.1rem}
  .nav-btn{padding:5px 8px;font-size:.72rem}
  .search-input{width:100px}
  .main{padding:8px 8px 40px}
  .card{grid-template-columns:28px 44px 1fr;gap:8px;padding:12px 10px}
  .rank{font-size:.95rem}
  .thumb{width:44px;height:44px}
  .thumb img{width:24px;height:24px}
  .card-title{font-size:.88rem}
  .card-actions{opacity:1}
  .panel{width:100vw}
  .kb-hint{display:none}
  .hdr-right{gap:3px}
}
</style>
</head>
<body>

<header class="hdr" id="hdr">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="logo">HN<sup>reader</sup></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="hdr-right">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Filter…" spellcheck="false">
    </div>
    <button class="hdr-btn" id="btnHide" title="Hide visited (h)"></button>
    <button class="hdr-btn" id="btnFollow" title="Followed stories"></button>
    <button class="hdr-btn" id="btnRefresh" title="Refresh (r)"></button>
  </div>
</header>

<main class="main" id="main">
  <div id="storyList" class="story-list"></div>
  <div id="skelList" class="skel-list"></div>
  <button class="load-more" id="loadMore" style="display:none">Load More</button>
</main>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel">
  <div class="panel-head" id="panelHead"></div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div class="fol-drop" id="folDrop"></div>

<div class="kb-hint">
  <span><kbd>j</kbd><kbd>k</kbd> navigate</span>
  <span><kbd>⏎</kbd> open</span>
  <span><kbd>c</kbd> comments</span>
  <span><kbd>f</kbd> follow</span>
  <span><kbd>h</kbd> hide seen</span>
  <span><kbd>Esc</kbd> close</span>
</div>

<script>
// ============================================================
// ICONS
// ============================================================
const I={
  eye:`<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff:`<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`,
  bm:`<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  bmF:`<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  cmt:`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  chev:`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  ext:`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  up:`<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
  clk:`<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  usr:`<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  close:`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  refresh:`<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  doc:`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
  hn:`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
  unfollow:`<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
};

// ============================================================
// CATEGORIES
// ============================================================
const CATS=[
  {id:'top',label:'Top',ep:'topstories'},
  {id:'new',label:'New',ep:'newstories'},
  {id:'best',label:'Best',ep:'beststories'},
  {id:'ask',label:'Ask HN',ep:'askstories'},
  {id:'show',label:'Show HN',ep:'showstories'},
  {id:'jobs',label:'Jobs',ep:'jobstories'},
];
const PAGE=30;
const API='https://hacker-news.firebaseio.com/v0';

// ============================================================
// STATE
// ============================================================
const S={
  cat:'top',ids:[],stories:[],page:0,loading:false,query:'',
  hideVisited:false,fi:-1,panelStory:null,panelOpen:false,
  folOpen:false
};
const cache=new Map();
let abortCtl=null;

// ============================================================
// STORAGE
// ============================================================
function getVis(){try{return new Set(JSON.parse(localStorage.getItem('hn_v')||'[]'))}catch{return new Set()}}
function setVis(v){localStorage.setItem('hn_v',JSON.stringify([...v]))}
function getFol(){try{return JSON.parse(localStorage.getItem('hn_f')||'{}')}catch{return{}}}
function setFol(f){localStorage.setItem('hn_f',JSON.stringify(f))}
function getOpt(k,d){try{const v=localStorage.getItem('hn_'+k);return v!==null?JSON.parse(v):d}catch{return d}}
function setOpt(k,v){localStorage.setItem('hn_'+k,JSON.stringify(v))}

// ============================================================
// UTILS
// ============================================================
function timeAgo(ts){
  const s=Math.floor(Date.now()/1000)-ts;
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function getDomain(u){try{return new URL(u).hostname.replace('www.','')}catch{return null}}
function faviconUrl(d){return`https://www.google.com/s2/favicons?domain=${d}&sz=64`}
function hashHue(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return((h%360)+360)%360}
function sanitize(h){
  return h.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,'')
    .replace(/\son\w+\s*=\s*"[^"]*"/gi,'').replace(/\son\w+\s*=\s*'[^']*'/gi,'')
    .replace(/<a\s/gi,'<a target="_blank" rel="noopener" ')
}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

// ============================================================
// API
// ============================================================
async function fetchItem(id){
  if(cache.has(id))return cache.get(id);
  try{
    const r=await fetch(`${API}/item/${id}.json`);
    if(!r.ok)return null;
    const d=await r.json();
    if(d)cache.set(id,d);
    return d;
  }catch{return null}
}
async function fetchItems(ids){
  const results=await Promise.allSettled(ids.map(fetchItem));
  return results.filter(r=>r.status==='fulfilled'&&r.value).map(r=>r.value);
}
async function loadIds(cat){
  const ep=CATS.find(c=>c.id===cat)?.ep||'topstories';
  const r=await fetch(`${API}/${ep}.json`);
  return await r.json();
}

// ============================================================
// RENDER NAV
// ============================================================
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=CATS.map(c=>`<button class="nav-btn${c.id===S.cat?' active':''}" data-cat="${c.id}">${c.label}</button>`).join('');
  nav.onclick=e=>{
    const btn=e.target.closest('.nav-btn');
    if(btn)switchCat(btn.dataset.cat);
  };
}

// ============================================================
// RENDER STORIES
// ============================================================
function showSkeletons(n=8){
  const el=document.getElementById('skelList');
  el.innerHTML=Array.from({length:n},(_,i)=>`
    <div class="skel" style="animation-delay:${i*60}ms">
      <div class="skel-rank"></div><div class="skel-thumb"></div>
      <div class="skel-body"><div class="skel-line w80"></div><div class="skel-line w50"></div><div class="skel-line w30"></div></div>
    </div>`).join('');
}
function hideSkeletons(){document.getElementById('skelList').innerHTML=''}

function renderStories(reset=false){
  const list=document.getElementById('storyList');
  const vis=getVis();
  const start=S.page*PAGE;
  const end=Math.min(start+PAGE,S.stories.length);
  const batch=S.stories.slice(start,end);

  const filtered=S.query
    ?batch.filter(s=>s.title.toLowerCase().includes(S.query.toLowerCase()))
    :batch;

  const html=filtered.filter(s=>!(S.hideVisited&&vis.has(s.id))).map((s,i)=>{
    const rank=start+i+1;
    const d=s.url?getDomain(s.url):null;
    const visited=vis.has(s.id);
    const isFollowed=!!getFol()[s.id];
    const thumb=d
      ?`<div class="thumb"><img src="${faviconUrl(d)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\\'thumb-text\\'>${d[0].toUpperCase()}</span>'"></div>`
      :`<div class="thumb">${I.doc}</div>`;
    const domain=d?`<span class="domain">${d}</span>`:'';
    const score=s.score!=null?`${I.up} ${s.score}`:'';
    const desc=s.descendants!=null?`${I.cmt} ${s.descendants}`:'';
    const meta=[score,`by ${s.by||'unknown'}`,I.clk+' '+timeAgo(s.time),domain,desc].filter(Boolean);
    return`<div class="card${visited?' visited':''}" data-id="${s.id}" style="animation-delay:${(i-start)*40}ms">
      <div class="rank">${rank}</div>
      ${thumb}
      <div class="card-body">
        <div class="card-title"><a href="${s.url||'https://news.ycombinator.com/item?id='+s.id}" target="_blank" rel="noopener" onclick="markVisited(${s.id})">${esc(s.title)}</a></div>
        <div class="card-meta">${meta.map((m,j)=>j?'<span class="sep">·</span>'+m:m).join('')}</div>
        <div class="card-actions">
          <button onclick="openPanel(${s.id})" title="Comments">${I.cmt} ${s.descendants??0}</button>
          <button onclick="event.stopPropagation();toggleFollow(${s.id})" title="Follow" class="${isFollowed?'followed':''}">${isFollowed?I.bmF:I.bm} ${isFollowed?'Following':'Follow'}</button>
          ${s.url?`<button onclick="window.open('${esc(s.url)}','_blank');markVisited(${s.id})" title="Open link">${I.ext} Link</button>`:''}
          <button onclick="event.stopPropagation();openHN(${s.id})" title="Open on HN">${I.hn} HN</button>
        </div>
      </div>
    </div>`;
  }).join('');

  if(reset)list.innerHTML=html;
  else list.insertAdjacentHTML('beforeend',html);

  const lm=document.getElementById('loadMore');
  lm.style.display=end<S.stories.length?'block':'none';
  if(S.query){
    const totalFiltered=S.stories.slice(start).filter(s=>s.title.toLowerCase().includes(S.query.toLowerCase())).length;
    lm.style.display=totalFiltered>PAGE?'block':'none';
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ============================================================
// COMMENTS
// ============================================================
function renderPanelHead(story){
  const d=story.url?getDomain(story.url):null;
  const isFol=!!getFol()[story.id];
  const score=story.score!=null?`${I.up} ${story.score}`:'';
  const desc=story.descendants!=null?`${I.cmt} ${story.descendants} comments`:'';
  const metaParts=[score,`by ${story.by||'unknown'}`,I.clk+' '+timeAgo(story.time),d?`<span class="domain">${d}</span>`:'',desc].filter(Boolean);

  let selfText='';
  if(story.text)selfText=`<div class="ph-selftext">${sanitize(story.text)}</div>`;

  return`<button class="ph-close" onclick="closePanel()">${I.close}</button>
    <div class="ph-title"><a href="${story.url||'https://news.ycombinator.com/item?id='+story.id}" target="_blank" rel="noopener" onclick="markVisited(${story.id})">${esc(story.title)}</a></div>
    <div class="ph-meta">${metaParts.map((m,j)=>j?'<span class="sep">·</span>'+m:m).join('')}</div>
    ${selfText}
    <div class="ph-actions">
      <button onclick="toggleFollow(${story.id});this.closest('.ph-actions').innerHTML=getPhActions(${story.id})" class="${isFol?'followed':''}">${isFol?I.bmF:I.bm} ${isFol?'Following':'Follow'}</button>
      <button onclick="openHN(${story.id})">${I.hn} Open on HN</button>
      ${story.url?`<button onclick="window.open('${esc(story.url)}','_blank');markVisited(${story.id})">${I.ext} Open Link</button>`:''}
    </div>`;
}

function getPhActions(id){
  const isFol=!!getFol()[id];
  return`<button onclick="toggleFollow(${id});this.closest('.ph-actions').innerHTML=getPhActions(${id})" class="${isFol?'followed':''}">${isFol?I.bmF:I.bm} ${isFol?'Following':'Follow'}</button>`;
}

async function loadComments(storyId){
  const body=document.getElementById('panelBody');
  body.innerHTML=`<div class="cmt-count">Loading comments…</div>`+
    Array.from({length:5},(_,i)=>`<div class="cmt-skel" style="animation-delay:${i*80}ms"><div class="cmt-skel-head"><div class="cmt-skel-bar w20"></div><div class="cmt-skel-bar w40"></div></div><div class="cmt-skel-bar w80"></div><div class="cmt-skel-bar w60" style="margin-top:6px"></div></div>`).join('');

  const story=await fetchItem(storyId);
  if(!story||!story.kids||!story.kids.length){
    body.innerHTML=`<div class="cmt-count">0 comments</div><div style="padding:20px;color:var(--text-dim);font-size:.85rem">No comments yet.</div>`;
    return;
  }
  body.innerHTML=`<div class="cmt-count">${story.descendants||0} comments</div><div id="cmtRoot"></div>`;
  const root=document.getElementById('cmtRoot');
  const comments=await fetchItems(story.kids);
  for(const c of comments){
    if(c)root.appendChild(buildComment(c,0));
  }
}

function buildComment(c,depth){
  if(!c)return document.createDocumentFragment();
  const wrap=document.createElement('div');
  const dClass='d'+Math.min(depth,6);

  if(c.dead){
    wrap.innerHTML=`<div class="cmt ${dClass} cmt-dead">[dead]</div>`;
    return wrap.firstChild;
  }
  if(c.deleted){
    wrap.innerHTML=`<div class="cmt ${dClass}"><div class="cmt-head"><span class="cmt-deleted">[deleted]</span></div></div>`;
    return wrap.firstChild;
  }

  const hasKids=c.kids&&c.kids.length;
  const isOP=S.panelStory&&c.by===S.panelStory.by;
  wrap.innerHTML=`<div class="cmt ${dClass}" data-id="${c.id}">
    <div class="cmt-head">
      ${hasKids?`<button class="cmt-toggle" onclick="toggleCmt(this)" aria-label="Collapse">${I.chev}</button>`:''}
      <span class="cmt-author${isOP?' op':''}">${esc(c.by||'')}</span>
      <span class="cmt-time">${timeAgo(c.time||0)}</span>
      ${hasKids?`<span class="cmt-replies" onclick="this.previousElementSibling.previousElementSibling.click()">${c.kids.length} ${c.kids.length===1?'reply':'replies'}</span>`:''}
    </div>
    <div class="cmt-body">${sanitize(c.text||'')}</div>
    ${hasKids?`<div class="cmt-children" data-kids='${JSON.stringify(c.kids)}' data-loaded="0" data-depth="${depth+1}"></div>`:''}
  </div>`;

  const el=wrap.firstChild;
  // Auto-load first two levels
  if(hasKids&&depth<1){
    const childContainer=el.querySelector('.cmt-children');
    loadChildComments(childContainer);
  }
  return el;
}

async function loadChildComments(container){
  if(container.dataset.loaded==='1')return;
  container.dataset.loaded='1';
  const ids=JSON.parse(container.dataset.kids);
  const depth=parseInt(container.dataset.depth);
  const comments=await fetchItems(ids);
  for(const c of comments){
    if(c)container.appendChild(buildComment(c,depth));
  }
}

function toggleCmt(btn){
  const cmt=btn.closest('.cmt');
  const children=cmt.querySelector(':scope > .cmt-children');
  if(!children)return;
  const collapsed=btn.classList.toggle('collapsed');
  children.style.display=collapsed?'none':'block';
}

// ============================================================
// FOLLOWED
// ============================================================
function renderFollowed(){
  const drop=document.getElementById('folDrop');
  const fol=getFol();
  const ids=Object.keys(fol);
  if(!ids.length){drop.innerHTML='<div class="fol-empty">No followed stories yet.<br>Click the bookmark on any story to follow its comments.</div>';return}
  drop.innerHTML=ids.map(id=>{
    const f=fol[id];
    const delta=Math.max(0,(f.currentCount||0)-(f.followedCount||0));
    return`<div class="fol-item" onclick="openPanel(${id});closeFol()">
      <div class="fol-item-body">
        <div class="fol-item-title">${esc(f.title||'Story #'+id)}</div>
        <div class="fol-item-meta">
          ${I.cmt} ${f.currentCount||0} comments
          ${delta?`<span class="fol-new">+${delta} new</span>`:''}
          <span>·</span> followed ${timeAgo(f.at/1000)}
        </div>
      </div>
      <button class="fol-rm" onclick="event.stopPropagation();unfollowStory(${id})" title="Unfollow">${I.unfollow}</button>
    </div>`;
  }).join('');
}

async function refreshFollowedCounts(){
  const fol=getFol();
  const ids=Object.keys(fol);
  if(!ids.length)return;
  const items=await fetchItems(ids.map(Number));
  let changed=false;
  for(const item of items){
    if(item&&fol[item.id]){
      const old=fol[item.id].currentCount||0;
      fol[item.id].currentCount=item.descendants||0;
      if(fol[item.id].currentCount!==old)changed=true;
    }
  }
  if(changed)setFol(fol);
  updateFollowBadge();
}

function updateFollowBadge(){
  const fol=getFol();
  const badge=document.getElementById('btnFollow').querySelector('.badge')||document.createElement('span');
  let total=0;
  for(const id of Object.keys(fol)){
    const f=fol[id];
    total+=Math.max(0,(f.currentCount||0)-(f.followedCount||0));
  }
  if(total>0){
    badge.className='badge';badge.textContent=total>99?'99+':total;
    document.getElementById('btnFollow').appendChild(badge);
  }else{
    badge.remove();
  }
}

// ============================================================
// ACTIONS
// ============================================================
function markVisited(id){
  const vis=getVis();vis.add(id);setVis(vis);
  const card=document.querySelector(`.card[data-id="${id}"]`);
  if(card)card.classList.add('visited');
}

function toggleFollow(id){
  const fol=getFol();
  if(fol[id]){delete fol[id]}
  else{
    const story=cache.get(id)||{};
    fol[id]={title:story.title||'Story',followedCount:story.descendants||0,currentCount:story.descendants||0,at:Date.now()};
  }
  setFol(fol);
  updateFollowBadge();
  renderFollowed();
  // Update card button if visible
  const card=document.querySelector(`.card[data-id="${id}"]`);
  if(card){
    const btn=card.querySelector('.card-actions button:nth-child(2)');
    if(btn){
      const isFol=!!fol[id];
      btn.className=isFol?'followed':'';
      btn.innerHTML=`${isFol?I.bmF:I.bm} ${isFol?'Following':'Follow'}`;
    }
  }
}

function unfollowStory(id){
  const fol=getFol();delete fol[id];setFol(fol);
  updateFollowBadge();renderFollowed();
  const card=document.querySelector(`.card[data-id="${id}"]`);
  if(card){
    const btn=card.querySelector('.card-actions button:nth-child(2)');
    if(btn){btn.className='';btn.innerHTML=`${I.bm} Follow`}
  }
}

function openHN(id){window.open(`https://news.ycombinator.com/item?id=${id}`,'_blank')}

async function openPanel(id){
  const story=await fetchItem(id);
  if(!story)return;
  S.panelStory=story;S.panelOpen=true;
  markVisited(id);
  document.getElementById('overlay').classList.add('on');
  document.getElementById('panel').classList.add('on');
  document.getElementById('panelHead').innerHTML=renderPanelHead(story);
  await loadComments(id);
  document.getElementById('panelBody').scrollTop=0;
}

function closePanel(){
  S.panelOpen=false;S.panelStory=null;
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
}

function closeFol(){
  S.folOpen=false;
  document.getElementById('folDrop').classList.remove('on');
}

async function switchCat(cat){
  if(S.cat===cat&&!S.loading)return;
  S.cat=cat;S.page=0;S.stories=[];S.ids=[];S.fi=-1;S.query='';
  document.getElementById('searchInput').value='';
  renderNav();
  const list=document.getElementById('storyList');list.innerHTML='';
  showSkeletons();
  try{
    if(abortCtl)abortCtl.abort();
    abortCtl=new AbortController();
    S.ids=await loadIds(cat);
    const firstBatch=S.ids.slice(0,PAGE);
    S.stories=await fetchItems(firstBatch);
    S.page=0;
    hideSkeletons();
    renderStories(true);
  }catch(e){
    if(e.name!=='AbortError'){
      hideSkeletons();
      list.innerHTML=`<div class="empty-state"><h3>Failed to load</h3><p>Could not fetch stories. Check your connection.</p><button class="retry-btn" onclick="switchCat('${cat}')">Retry</button></div>`;
    }
  }
}

async function loadMore(){
  if(S.loading)return;
  S.loading=true;
  S.page++;
  const start=S.page*PAGE;
  const batchIds=S.ids.slice(start,start+PAGE);
  const more=await fetchItems(batchIds);
  S.stories.push(...more);
  renderStories(false);
  S.loading=false;
}

function toggleHideVisited(){
  S.hideVisited=!S.hideVisited;
  setOpt('hv',S.hideVisited);
  document.getElementById('btnHide').classList.toggle('on',S.hideVisited);
  document.getElementById('btnHide').innerHTML=S.hideVisited?I.eyeOff:I.eye;
  renderStories(true);
}

function toggleFolDrop(){
  S.folOpen=!S.folOpen;
  document.getElementById('folDrop').classList.toggle('on',S.folOpen);
  if(S.folOpen)renderFollowed();
}

// ============================================================
// KEYBOARD
// ============================================================
function handleKey(e){
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  const cards=[...document.querySelectorAll('.card')];

  switch(e.key){
    case'j':case'ArrowDown':
      e.preventDefault();
      S.fi=Math.min(S.fi+1,cards.length-1);
      focusCard(cards);
      break;
    case'k':case'ArrowUp':
      e.preventDefault();
      S.fi=Math.max(S.fi-1,0);
      focusCard(cards);
      break;
    case'Enter':case'o':
      if(S.fi>=0&&cards[S.fi]){
        e.preventDefault();
        const id=cards[S.fi].dataset.id;
        const story=cache.get(Number(id));
        if(story?.url){window.open(story.url,'_blank');markVisited(Number(id))}
        else openPanel(Number(id));
      }
      break;
    case'c':
      if(S.fi>=0&&cards[S.fi]){e.preventDefault();openPanel(Number(cards[S.fi].dataset.id))}
      break;
    case'f':
      if(S.fi>=0&&cards[S.fi]){e.preventDefault();toggleFollow(Number(cards[S.fi].dataset.id))}
      break;
    case'h':
      e.preventDefault();toggleHideVisited();break;
    case'r':
      if(!S.panelOpen){e.preventDefault();switchCat(S.cat)}
      break;
    case's':
      e.preventDefault();document.getElementById('searchInput').focus();break;
    case'Escape':
      if(S.panelOpen)closePanel();
      else if(S.folOpen)closeFol();
      break;
    case'1':case'2':case'3':case'4':case'5':case'6':
      if(!S.panelOpen){e.preventDefault();switchCat(CATS[parseInt(e.key)-1].id)}
      break;
  }
}
function focusCard(cards){
  cards.forEach(c=>c.classList.remove('focused'));
  if(S.fi>=0&&cards[S.fi]){
    cards[S.fi].classList.add('focused');
    cards[S.fi].scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

// ============================================================
// INIT
// ============================================================
async function init(){
  S.hideVisited=getOpt('hv',false);
  document.getElementById('btnHide').innerHTML=S.hideVisited?I.eyeOff:I.eye;
  document.getElementById('btnHide').classList.toggle('on',S.hideVisited);
  document.getElementById('btnFollow').innerHTML=I.bm;

  renderNav();

  document.getElementById('btnHide').onclick=toggleHideVisited;
  document.getElementById('btnFollow').onclick=toggleFolDrop;
  document.getElementById('btnRefresh').innerHTML=I.refresh;
  document.getElementById('btnRefresh').onclick=()=>switchCat(S.cat);
  document.getElementById('overlay').onclick=closePanel;
  document.getElementById('loadMore').onclick=loadMore;

  document.getElementById('searchInput').addEventListener('input',debounce(e=>{
    S.query=e.target.value.trim();
    renderStories(true);
  },200));

  document.addEventListener('keydown',handleKey);

  // Close followed dropdown on outside click
  document.addEventListener('click',e=>{
    if(S.folOpen&&!e.target.closest('#folDrop')&&!e.target.closest('#btnFollow')){
      closeFol();
    }
  });

  // Card click delegation
  document.getElementById('storyList').addEventListener('click',e=>{
    const link=e.target.closest('a');
    const btn=e.target.closest('button');
    if(link||btn)return; // let link/button handle it
    const card=e.target.closest('.card');
    if(card)openPanel(Number(card.dataset.id));
  });

  await switchCat('top');
  refreshFollowedCounts();
  // Refresh followed counts every 2 min
  setInterval(refreshFollowedCounts,120000);
}

init();
</script>
